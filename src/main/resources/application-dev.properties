
server.port = 8888
logging.config = classpath:log4j2-spring.xml

dubbo.consumer.timeout=60000
dubbo.config.multiple=true
dubbo.reference.check=false
dubbo.applications.user.id=corgi-user
dubbo.applications.user.name=corgi-user
dubbo.registries.registry1.id=registry1
dubbo.registries.registry1.protocol=zookeeper
dubbo.registries.registry1.address =localhost:2181
dubbo.protocols.dubbo.name = dubbo
dubbo.protocols.dubbo.port = -1
